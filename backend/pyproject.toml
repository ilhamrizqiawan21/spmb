[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spmb-terpadu-backend"
version = "0.1.0"
description = "Backend API for SPMB Terpadu 2026/2027."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15,<4",
    "django-cors-headers>=4.4,<5",
    "django-redis>=5.4,<6",
    "celery[redis]>=5.4,<6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "fakeredis>=2.26,<3",
    "pgserver>=0.1.4,<1",
    "mypy>=1.14,<2",
    "django-stubs[compatible-mypy]>=5.1,<6",
    "djangorestframework-stubs>=3.15,<4",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.testing"
