name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report foundation status
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') == '' }}
        run: echo "Backend project files are not initialized yet; CI skeleton is ready."

      - name: Install dependencies
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Lint
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') != '' }}
        run: ruff check .

      - name: Test
        if: ${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') != '' }}
        run: pytest
